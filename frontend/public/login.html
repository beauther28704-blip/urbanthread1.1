<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Access | UrbanThread</title>
  <meta name="description" content="Sign in or register as a Customer or Verified Streetwear Vendor on UrbanThread." />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#090a0f',
              surface: '#11131b',
              card: '#161924',
              border: '#232736',
              accent: '#38bdf8',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090a0f; color: #f1f5f9; }
    h1, h2, h3, h4, .font-display { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-[#090a0f] text-slate-100 min-h-screen flex flex-col selection:bg-sky-500 selection:text-white">

  <!-- ========================================== -->
  <!-- PROJECT TEAM RECOGNITION BANNER            -->
  <!-- ========================================== -->
  <div class="bg-gradient-to-r from-sky-950 via-slate-900 to-indigo-950 border-b border-sky-800/40 text-xs py-2 px-4 text-center">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-center gap-x-6 gap-y-1 text-slate-300">
      <span class="text-sky-400 font-semibold tracking-wider uppercase text-[11px]">UrbanThread Engineering Collective:</span>
      <span>Prince Wisdom</span>
      <span class="text-slate-600">·</span>
      <span>Beauther Ndemo</span>
      <span class="text-slate-600">·</span>
      <span>Scarlett Flowerlett</span>
      <span class="text-slate-600">·</span>
      <span>Bianca Akinyi</span>
      <span class="text-slate-600">·</span>
      <span>Lucy Ruguru</span>
    </div>
  </div>

  <!-- Header -->
  <header class="border-b border-[#232736] bg-[#090a0f]/90">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/index.html" class="text-xl font-extrabold tracking-tight font-display text-white flex items-center gap-2">
        <span class="w-2.5 h-2.5 bg-sky-400 rounded-sm"></span>
        <span>URBAN<span class="text-sky-400">THREAD</span></span>
      </a>
      <a href="/index.html" class="text-xs text-slate-400 hover:text-white transition-colors">
        &larr; Return to Storefront
      </a>
    </div>
  </header>

  <!-- Auth Box -->
  <main class="flex-1 flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-[#11131b] border border-[#232736] rounded-2xl p-8 space-y-6 shadow-2xl">
      
      <!-- Mode Tabs (Sign In / Register) -->
      <div class="flex items-center p-1 bg-[#161924] border border-[#232736] rounded-xl">
        <button id="tab-login" onclick="setMode('login')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-sky-500 text-slate-950">
          Sign In
        </button>
        <button id="tab-register" onclick="setMode('register')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-white">
          Register Account
        </button>
      </div>

      <!-- Header Copy -->
      <div>
        <h1 id="form-heading" class="text-2xl font-black font-display text-white">Access Portal</h1>
        <p id="form-subheading" class="text-xs text-slate-400 mt-1">Sign in with your role-verified UrbanThread credentials.</p>
      </div>

      <!-- Quick 1-Click Demo Profiles -->
      <div class="bg-[#161924] border border-[#232736] rounded-xl p-3.5 space-y-2">
        <span class="text-[10px] uppercase font-bold tracking-wider text-sky-400 block">Instant 1-Click Role Presets:</span>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <button onclick="fillPreset('admin')" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-center font-medium">
            Admin
          </button>
          <button onclick="fillPreset('vendor')" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-center font-medium">
            Vendor
          </button>
          <button onclick="fillPreset('customer')" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-center font-medium">
            Customer
          </button>
        </div>
      </div>

      <!-- Auth Form -->
      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        
        <!-- Registration-Only Fields -->
        <div id="field-name" class="hidden space-y-1">
          <label class="block text-xs font-semibold text-slate-300">Full Name</label>
          <input 
            type="text" 
            id="input-name" 
            placeholder="e.g. Scarlett Flowerlett" 
            class="w-full bg-[#161924] border border-[#232736] focus:border-sky-500 rounded-lg px-4 py-2.5 text-xs text-white focus:outline-none"
          />
        </div>

        <div id="field-role" class="hidden space-y-2">
          <label class="block text-xs font-semibold text-slate-300">Account Role Classification</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center gap-2 p-2.5 rounded-lg border border-[#232736] bg-[#161924] cursor-pointer hover:border-slate-600">
              <input type="radio" name="account-role" value="customer" checked onchange="handleRoleChange()" class="accent-sky-500">
              <span class="text-xs text-white">Customer</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-lg border border-[#232736] bg-[#161924] cursor-pointer hover:border-slate-600">
              <input type="radio" name="account-role" value="vendor" onchange="handleRoleChange()" class="accent-sky-500">
              <span class="text-xs text-white">Business / Vendor</span>
            </label>
          </div>
        </div>

        <div id="field-brand" class="hidden space-y-1">
          <label class="block text-xs font-semibold text-slate-300">Atelier / Brand Name</label>
          <input 
            type="text" 
            id="input-brand" 
            placeholder="e.g. Tokyo Void Studio" 
            class="w-full bg-[#161924] border border-[#232736] focus:border-sky-500 rounded-lg px-4 py-2.5 text-xs text-white focus:outline-none"
          />
        </div>

        <!-- Standard Fields -->
        <div class="space-y-1">
          <label class="block text-xs font-semibold text-slate-300">Email Address</label>
          <input 
            type="email" 
            id="input-email" 
            required 
            value="admin@urbanthread.co"
            placeholder="name@urbanthread.co" 
            class="w-full bg-[#161924] border border-[#232736] focus:border-sky-500 rounded-lg px-4 py-2.5 text-xs text-white focus:outline-none"
          />
        </div>

        <div class="space-y-1">
          <label class="block text-xs font-semibold text-slate-300">Password</label>
          <input 
            type="password" 
            id="input-password" 
            required 
            value="AdminPass2026!"
            placeholder="••••••••" 
            class="w-full bg-[#161924] border border-[#232736] focus:border-sky-500 rounded-lg px-4 py-2.5 text-xs text-white focus:outline-none"
          />
        </div>

        <div id="auth-alert" class="hidden text-xs p-3 rounded-lg bg-red-950/60 border border-red-800 text-red-200">
        </div>

        <button 
          type="submit" 
          id="submit-btn" 
          class="w-full py-3 bg-sky-500 hover:bg-sky-400 active:scale-[0.98] text-slate-950 font-bold text-xs rounded-lg transition-all shadow-lg shadow-sky-500/20"
        >
          Sign In to Portal
        </button>
      </form>

    </div>
  </main>

  <script>
    let mode = 'login';

    function setMode(newMode) {
      mode = newMode;
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');
      const nameField = document.getElementById('field-name');
      const roleField = document.getElementById('field-role');
      const brandField = document.getElementById('field-brand');
      const heading = document.getElementById('form-heading');
      const subheading = document.getElementById('form-subheading');
      const submitBtn = document.getElementById('submit-btn');

      if (mode === 'login') {
        tabLogin.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-sky-500 text-slate-950";
        tabReg.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-white";
        nameField.classList.add('hidden');
        roleField.classList.add('hidden');
        brandField.classList.add('hidden');
        heading.innerText = "Access Portal";
        subheading.innerText = "Sign in with your role-verified UrbanThread credentials.";
        submitBtn.innerText = "Sign In to Portal";
      } else {
        tabLogin.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-white";
        tabReg.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-sky-500 text-slate-950";
        nameField.classList.remove('hidden');
        roleField.classList.remove('hidden');
        heading.innerText = "Create Account";
        subheading.innerText = "Register as an exclusive Streetwear Collector or Business Atelier Vendor.";
        submitBtn.innerText = "Complete Registration";
        handleRoleChange();
      }
    }

    function handleRoleChange() {
      const isVendor = document.querySelector('input[name="account-role"]:checked')?.value === 'vendor';
      const brandField = document.getElementById('field-brand');
      if (isVendor) {
        brandField.classList.remove('hidden');
      } else {
        brandField.classList.add('hidden');
      }
    }

    function fillPreset(role) {
      setMode('login');
      const emailInput = document.getElementById('input-email');
      const passInput = document.getElementById('input-password');

      if (role === 'admin') {
        emailInput.value = 'admin@urbanthread.co';
        passInput.value = 'AdminPass2026!';
      } else if (role === 'vendor') {
        emailInput.value = 'vendor@urbanthread.co';
        passInput.value = 'VendorPass2026!';
      } else if (role === 'customer') {
        emailInput.value = 'customer@urbanthread.co';
        passInput.value = 'CustomerPass2026!';
      }
    }

    async function handleAuthSubmit(event) {
      event.preventDefault();
      const alertBox = document.getElementById('auth-alert');
      alertBox.classList.add('hidden');

      const email = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value;

      if (mode === 'login') {
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (!data.success) {
            throw new Error(data.message || 'Login failed.');
          }

          localStorage.setItem('urbanthread_token', data.token);
          localStorage.setItem('urbanthread_user', JSON.stringify(data.user));

          // Redirect based on role
          if (data.user.role === 'admin' || data.user.role === 'vendor') {
            window.location.href = '/admin.html';
          } else {
            window.location.href = '/index.html';
          }
        } catch (err) {
          // Fallback simulation if running standalone static HTML
          handleClientSideAuth(email, password);
        }
      } else {
        // Registration mode
        const name = document.getElementById('input-name').value.trim();
        const role = document.querySelector('input[name="account-role"]:checked')?.value || 'customer';
        const brandName = document.getElementById('input-brand').value.trim();

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password, role, brandName })
          });
          const data = await res.json();
          if (!data.success) throw new Error(data.message || 'Registration failed.');

          localStorage.setItem('urbanthread_token', data.token);
          localStorage.setItem('urbanthread_user', JSON.stringify(data.user));

          if (role === 'vendor') {
            window.location.href = '/admin.html';
          } else {
            window.location.href = '/index.html';
          }
        } catch (e) {
          // Client side fallback
          const fakeUser = {
            id: 'usr_' + Date.now(),
            name: name || 'Streetwear Enthusiast',
            email,
            role,
            brandName: brandName || ''
          };
          localStorage.setItem('urbanthread_token', 'demo_token_' + Date.now());
          localStorage.setItem('urbanthread_user', JSON.stringify(fakeUser));
          window.location.href = role === 'vendor' ? '/admin.html' : '/index.html';
        }
      }
    }

    function handleClientSideAuth(email, password) {
      let role = 'customer';
      let name = 'Streetwear Customer';

      if (email.includes('admin')) {
        role = 'admin';
        name = 'Prince Wisdom (Admin)';
      } else if (email.includes('vendor')) {
        role = 'vendor';
        name = 'Beauther Ndemo (Vendor)';
      } else {
        name = 'Scarlett Flowerlett (Customer)';
      }

      const user = { id: 'usr_' + role, name, email, role };
      localStorage.setItem('urbanthread_token', 'jwt_' + role + '_demo');
      localStorage.setItem('urbanthread_user', JSON.stringify(user));

      if (role === 'admin' || role === 'vendor') {
        window.location.href = '/admin.html';
      } else {
        window.location.href = '/index.html';
      }
    }
  </script>
</body>
</html>
